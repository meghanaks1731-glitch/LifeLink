<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink | Emergency Information</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

<header>
    <div class="logo">🚑 LifeLink</div>

    <button onclick="location.href='profile.html'">
        Edit Profile
    </button>
</header>

<section class="profile-section">

    <div class="profile-box">

        <h1>🚨 Emergency Information</h1>

        <p>
            Critical information provided by the LifeLink user.
        </p>

        <div id="emergencyData"></div>

        <div class="qr-area">

            <h2>📱 LifeLink QR</h2>

            <div id="qrcode"></div>

            <p>
                Scan this QR to access emergency information.
            </p>

        </div>

        <h2>📋 Access History</h2>

        <div id="accessLog">
            No access recorded yet.
        </div>

    </div>

</section>

<script src="qr.js"></script>

</body>
</html>
